name: Daily KSU News Digest

on:
  schedule:
    # 09:30 Europe/Kyiv:
    # - Summer (EEST, UTC+3): 06:30 UTC
    # - Winter (EET, UTC+2):  07:30 UTC
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending Telegram messages or updating state.json"
        required: false
        type: boolean
        default: false
      force:
        description: "Bypass same-day digest guard"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ksu-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check Europe/Kyiv 09:30 DST schedule
        id: kyiv_gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          PYTHONPATH=src python -m ksu_news_monitor --check-schedule

      - name: Install dependencies
        if: steps.kyiv_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KSU news monitor
        if: steps.kyiv_gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '72' }}
          SEND_EMPTY_DIGEST: ${{ vars.SEND_EMPTY_DIGEST || 'false' }}
          GOOGLE_NEWS_QUERIES: ${{ vars.GOOGLE_NEWS_QUERIES || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          PYTHONPATH=src python -m ksu_news_monitor

      - name: Commit updated state.json
        if: steps.kyiv_gate.outputs.should_run == 'true' && inputs.dry_run != true
        run: |
          if git diff --quiet state.json; then
            echo "state.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update state.json [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
